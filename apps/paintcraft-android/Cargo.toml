[package]
name = "paintcraft-android"
description = "PaintCraft for Android: PhotoCraft's engine behind an ibisPaint-style touch interface (GameActivity app, not a web view)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "paintcraft_android"
crate-type = ["cdylib"]

# Everything is Android-only. On other targets this crate is an empty library, so
# `cargo build --workspace` keeps working elsewhere.
[target.'cfg(target_os = "android")'.dependencies]
paintcraft-ui = { path = "../../crates/paintcraft-ui" }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-game-activity"] }
android-activity = { version = "0.6", features = ["game-activity"] }
jni = "0.21"
log = { workspace = true }

# JNI and the exported entry points need `unsafe`; this crate does not use the workspace lint table.
[lints.rust]
unsafe_code = "allow"
